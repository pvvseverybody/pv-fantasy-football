name: Week 5 Fantasy Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/week-5-run-now.trigger

permissions:
  contents: read
  id-token: write

concurrency:
  group: pv-fantasy-week-5
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run guarded Week 5 final reconciliation
        run: |
          set -euo pipefail
          token=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pv-fantasy-week-5" | jq -r .value)
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            https://fantasy.pvvseverybody.com/api/automation/week-5)
          printf '%s\n' "$response"
